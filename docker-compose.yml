name: eyes-mcp

services:
  eyes-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: eyes-mcp:0.1.0
    container_name: eyes-mcp
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      EYES_HTTP_HOST: 0.0.0.0
      EYES_HTTP_PORT: 8787
      EYES_LOG_LEVEL: ${EYES_LOG_LEVEL:-info}
      EYES_DATA_DIR: /data
      EYES_MAX_SHARDS: ${EYES_MAX_SHARDS:-5}
      EYES_MAX_ITERATIONS: ${EYES_MAX_ITERATIONS:-2}
      EYES_TOKEN_BUDGET: ${EYES_TOKEN_BUDGET:-80000}
      EYES_TIME_BUDGET_SEC: ${EYES_TIME_BUDGET_SEC:-120}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemma-4-31b-it}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com}
      SEARXNG_URL: http://searxng:8080
      CRAWL4AI_URL: http://crawl4ai:11235
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      REDDIT_CLIENT_ID: ${REDDIT_CLIENT_ID:-}
      REDDIT_CLIENT_SECRET: ${REDDIT_CLIENT_SECRET:-}
    volumes:
      - ./data:/data
    depends_on:
      searxng:
        condition: service_healthy
      crawl4ai:
        condition: service_started
    networks:
      - eyes-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  searxng:
    image: searxng/searxng:latest
    container_name: eyes-searxng
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./searxng:/etc/searxng:ro
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-change-me-openssl-rand-hex-32}
      UWSGI_WORKERS: 4
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - eyes-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: eyes-redis
    restart: unless-stopped
    # Internal only — not exposed to the host.
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    networks:
      - eyes-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  crawl4ai:
    image: unclecode/crawl4ai:0.8.9
    container_name: eyes-crawl4ai
    restart: unless-stopped
    ports:
      - "11235:11235"
    environment:
      CRAWL4AI_HOST: 0.0.0.0
      CRAWL4AI_PORT: 11235
    networks:
      - eyes-net
    # Crawl4AI's own readiness check; do not block eyes-mcp on it.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:11235/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  eyes-net:
    driver: bridge

volumes:
  redis-data:
    name: eyes-redis-data
